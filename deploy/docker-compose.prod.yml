# Produção em VPS: app + Postgres + GoTrue + PostgREST atrás do Caddy (TLS automático).
# Só o Caddy publica portas (80/443). Banco, auth e rest ficam na rede interna.
# Uso: copie deploy/.env.example para deploy/.env, gere os segredos (deploy/scripts/gen-secrets.mjs)
# e rode: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: maisfisio-prod

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: public.ecr.aws/supabase/postgres:17.11.0.011
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
      - ./scripts/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    # sem "ports": o banco nunca é exposto fora da rede interna

  migrate:
    image: public.ecr.aws/supabase/postgres:17.11.0.011
    depends_on:
      auth:
        condition: service_started
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
    volumes:
      - ../supabase/migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["bash", "/migrate.sh"]

  auth:
    <<: *restart
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL:?defina PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-no-reply@localhost}

  rest:
    <<: *restart
    image: public.ecr.aws/supabase/postgrest:v16.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  web:
    <<: *restart
    build:
      context: ..
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?defina ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${PUBLIC_URL}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?defina SERVICE_ROLE_KEY}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_URL}
    # o servidor Next acessa o próprio domínio público (mesma URL do navegador, cookies iguais)
    # passando pelo Caddy do host
    extra_hosts:
      - "${SITE_HOST:?defina SITE_HOST}:host-gateway"

  caddy:
    <<: *restart
    image: caddy:2.8
    depends_on: [web, auth, rest]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?defina SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
